<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama + FastAPI Chat</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #response { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>Chat with Ollama</h2>
    <textarea id="prompt" placeholder="Ask Ollama something..."></textarea><br>
    <button onclick="sendPrompt()">Send Prompt</button>

    <h3>Response:</h3>
    <div id="response">Waiting for input...</div>

    <script>
        async function sendPrompt() {
            const promptText = document.getElementById("prompt").value;
            const responseDiv = document.getElementById("response");

            if (!promptText.trim()) {
                alert("Please enter a prompt.");
                return;
            }

            responseDiv.innerText = "Thinking...";

            try {
                const res = await fetch("http://127.0.0.1:8000/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        prompt: promptText,
                        model: "llama3" // Ensure this model is pulled in Ollama
                    })
                });

                if (!res.ok) {
                    throw new Error(`Server Error: ${res.status}`);
                }

                const data = await res.json();
                responseDiv.innerText = data.response;
            } catch (error) {
                responseDiv.innerText = "Error: " + error.message;
            }
        }
    </script>

</body>
</html>
